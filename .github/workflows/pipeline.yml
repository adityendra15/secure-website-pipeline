name: Secure build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: jobs get nothing unless they ask for it.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/secure-website
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-scan-deploy:
    name: Build, scan, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Container registries reject uppercase in image names, and GitHub
      # usernames can contain uppercase letters.
      - name: Normalise image name to lowercase
        run: echo "IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ---------------------------------------------------------------
      # Security stage. Everything below runs BEFORE the image is pushed
      # to the registry.
      # ---------------------------------------------------------------

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Scan image for vulnerabilities
        run: |
          mkdir -p reports
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --format table "$IMAGE_NAME:$IMAGE_TAG" | tee reports/trivy-report.txt
          trivy image --scanners vuln \
            --format json --output reports/trivy-report.json "$IMAGE_NAME:$IMAGE_TAG"

      - name: Generate SBOM
        run: |
          trivy image --format cyclonedx \
            --output reports/sbom.cyclonedx.json "$IMAGE_NAME:$IMAGE_TAG"

      - name: Upload scan report and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 30

      # ---------------------------------------------------------------
      # Promotion: image is scanned and inventoried, so publish it.
      # ---------------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to registry
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"

      # ---------------------------------------------------------------
      # Deploy. A disposable Kubernetes cluster runs inside the CI runner,
      # so the whole rollout is verified on every push.
      # ---------------------------------------------------------------

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster

      - name: Load image into the cluster
        run: kind load docker-image "$IMAGE_NAME:$IMAGE_TAG" --name ci-cluster

      - name: Deploy to Kubernetes
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_NAME:$IMAGE_TAG|g" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Wait for rollout to succeed
        run: kubectl rollout status deployment/secure-website --timeout=180s

      - name: Smoke test the running service
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- \
            curl -sf http://secure-website.default.svc.cluster.local/healthz

      - name: Report cluster state
        if: always()
        run: |
          kubectl get pods -o wide
          kubectl get deployment secure-website -o wide
